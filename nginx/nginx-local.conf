worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    server {
        listen 80;
        server_name s.partsbazar360.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name s.partsbazar360.com;

        ssl_certificate /etc/letsencrypt/live/s.partsbazar360.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s.partsbazar360.com/privkey.pem;

        location = / {
            return 302 https://$host/buyer/;
        }

        location = /robots.txt {
            return 302 https://$host/buyer/robots.txt;
        }
        location = /sitemap.xml {
            return 302 https://$host/buyer/sitemap.xml;
        }

        location ~ ^/(search|garage|cart|checkout|watchlist|support|account|parts|part|brands|vehicles)(/.*)?$ {
            return 302 https://$host/buyer$request_uri;
        }

        location /admin/ {
            set $admin_upstream http://admin-portal:3000;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~* ^/buyer/_next/static/ {
            proxy_pass http://buyer-marketplace:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ~* ^/admin/_next/static/ {
            proxy_pass http://admin-portal:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ~* ^/seller/_next/static/ {
            proxy_pass http://seller-portal:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ~* ^/workshop/_next/static/ {
            proxy_pass http://workshop-portal:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /buyer/ {
            set $buyer_upstream http://buyer-marketplace:3000;
            proxy_pass $buyer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header X-Country-Code $http_cf_ipcountry;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /seller/ {
            set $seller_upstream http://seller-portal:3000;
            proxy_pass $seller_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /operations/sellers/ {
            return 301 /admin/sellers/;
        }
        location /operations/ {
            return 301 /admin/operations/;
        }

        location /workshop/ {
            set $workshop_upstream http://workshop-portal:3000;
            proxy_pass $workshop_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /img-proxy/ {
            set $target_url $arg_url;
            proxy_pass $target_url;
            proxy_ssl_server_name on;
            proxy_set_header Host $proxy_host;
            proxy_set_header Referer "";
            proxy_set_header User-Agent "Mozilla/5.0";
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=604800" always;
            expires 7d;
            proxy_buffering on;
            proxy_buffers 8 64k;
        }
    }
}
