services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-local.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - admin-portal
      - buyer-marketplace
      - seller-portal
      - workshop-portal

  api:
    image: partsbazar360-api:latest
    build: null
    environment:
      CORS_ORIGIN: https://s.partsbazar360.com
      BUYER_APP_URL: https://s.partsbazar360.com/buyer
      ADMIN_APP_URL: https://s.partsbazar360.com/admin
      RUN_INGESTION_WORKER: "0"

  worker:
    image: partsbazar360-worker:latest
    build: null
    environment:
      RUN_INGESTION_WORKER: "1"
      ADMIN_APP_URL: https://s.partsbazar360.com/admin

  admin-portal:
    image: partsbazar360-admin-portal:local
    build: null

  buyer-marketplace:
    image: partsbazar360-buyer-marketplace:local
    build: null
    environment:
      SITE_URL: https://s.partsbazar360.com/buyer

  seller-portal:
    image: partsbazar360-seller-portal:local
    build: null

  workshop-portal:
    image: partsbazar360-workshop-portal:local
    build: null

  certbot:
    profiles:
      - donotstart
