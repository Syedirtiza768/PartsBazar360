services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: partsbazar_user
      POSTGRES_PASSWORD: partsbazar_password
      POSTGRES_DB: partsbazar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partsbazar_user -d partsbazar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ComplexAdminPassword123!
      # Security plugin disabled for local/MVP use so the API can talk to
      # OpenSearch over plain HTTP without managing TLS certs.
      - plugins.security.disabled=true
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # ── Application Services ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://partsbazar_user:partsbazar_password@postgres:5432/partsbazar_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSEARCH_URL: http://opensearch:9200
      PORT: 3001
      CORS_ORIGIN: https://partsbazar360.com
      REALTRACK_API_URL: https://mhn.realtrackapp.com/api
      REALTRACK_API_EMAIL: api-published-listings@realtrack.local
      REALTRACK_API_PASSWORD: Ebay$321
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-partsbazar-prod-change-me}
      BUYER_APP_URL: ${BUYER_APP_URL:-https://partsbazar360.com/buyer}
      BUYER_INTERNAL_URL: http://buyer-marketplace:3000/buyer
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      TAMARA_API_URL: ${TAMARA_API_URL:-https://api-sandbox.tamara.co}
      TAMARA_API_TOKEN: ${TAMARA_API_TOKEN:-}
      TAMARA_NOTIFICATION_TOKEN: ${TAMARA_NOTIFICATION_TOKEN:-}
      TAMARA_PUBLIC_KEY: ${TAMARA_PUBLIC_KEY:-}
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-info@partsbazar360.com}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-PartsBazar360}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      RUN_INGESTION_WORKER: "0"
      # Enqueue-only: an OpenRouter call must never sit in front of a request.
      RUN_ENRICHMENT_WORKER: "0"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-0}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-realtrack}
      ENRICHMENT_PREWARM: ${ENRICHMENT_PREWARM:-0}
      SHIPPING_VOLUMETRIC_DIVISOR: ${SHIPPING_VOLUMETRIC_DIVISOR:-6000}
      SHIPPING_MAX_PARCEL_KG: ${SHIPPING_MAX_PARCEL_KG:-30}
      SHIPPING_ESTIMATE_MARGIN_PCT: ${SHIPPING_ESTIMATE_MARGIN_PCT:-15}
      SHIPPING_ESTIMATED_VOLUMETRIC_FACTOR: ${SHIPPING_ESTIMATED_VOLUMETRIC_FACTOR:-0.8}
      ENRICHMENT_MEDIA_DIR: /app/data/enrichment
      SCHEMA_MODE: ${SCHEMA_MODE:-migrate}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    volumes:
      - enrichment_media:/app/data/enrichment
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # BullMQ consumers — keeps RealTrack sync off the request-serving API process.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["./docker-entrypoint-worker.sh"]
    environment:
      DATABASE_URL: postgresql://partsbazar_user:partsbazar_password@postgres:5432/partsbazar_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSEARCH_URL: http://opensearch:9200
      RUN_INGESTION_WORKER: "1"
      SKIP_OS_INDEX_ON_INGEST: "1"
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-8}
      REALTRACK_API_URL: https://mhn.realtrackapp.com/api
      REALTRACK_API_EMAIL: api-published-listings@realtrack.local
      REALTRACK_API_PASSWORD: Ebay$321
      OPENSEARCH_REFRESH_ON_INDEX: ${OPENSEARCH_REFRESH_ON_INDEX:-false}
      # AI enrichment runs here, never in the API process.
      RUN_ENRICHMENT_WORKER: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-0}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-realtrack}
      ENRICHMENT_DAILY_BUDGET_USD: ${ENRICHMENT_DAILY_BUDGET_USD:-5}
      ENRICHMENT_CONCURRENCY: ${ENRICHMENT_CONCURRENCY:-2}
      ENRICHMENT_PREWARM: ${ENRICHMENT_PREWARM:-0}
      ENRICHMENT_WEIGHT_MODEL: ${ENRICHMENT_WEIGHT_MODEL:-}
      ENRICHMENT_ESCALATION_MODEL: ${ENRICHMENT_ESCALATION_MODEL:-}
      INFOGRAPHIC_MIN_PRICE_USD: ${INFOGRAPHIC_MIN_PRICE_USD:-300}
      INFOGRAPHIC_MODEL: ${INFOGRAPHIC_MODEL:-}
      LOCATION_DIAGRAM_MIN_PRICE_USD: ${LOCATION_DIAGRAM_MIN_PRICE_USD:-300}
      LOCATION_DIAGRAM_MODEL: ${LOCATION_DIAGRAM_MODEL:-}
      ENRICHMENT_MEDIA_DIR: /app/data/enrichment
      # Needed to drop the buyer ISR cache once a part is enriched.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      BUYER_INTERNAL_URL: http://buyer-marketplace:3000/buyer
      SHIPPING_VOLUMETRIC_DIVISOR: ${SHIPPING_VOLUMETRIC_DIVISOR:-6000}
      SHIPPING_MAX_PARCEL_KG: ${SHIPPING_MAX_PARCEL_KG:-30}
      SHIPPING_ESTIMATE_MARGIN_PCT: ${SHIPPING_ESTIMATE_MARGIN_PCT:-15}
      SHIPPING_ESTIMATED_VOLUMETRIC_FACTOR: ${SHIPPING_ESTIMATED_VOLUMETRIC_FACTOR:-0.8}
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-info@partsbazar360.com}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-PartsBazar360}
    volumes:
      - enrichment_media:/app/data/enrichment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  admin-portal:
    build:
      context: .
      dockerfile: apps/next.Dockerfile
      args:
        APP_NAME: admin-portal
    restart: unless-stopped
    networks:
      - app-network

  buyer-marketplace:
    build:
      context: .
      dockerfile: apps/next.Dockerfile
      args:
        APP_NAME: buyer-marketplace
    environment:
      # Server components/route handlers run inside this container and can
      # reach the API directly over the compose network (faster + avoids an
      # extra hop through nginx for SSR data fetching).
      INTERNAL_API_URL: http://api:3001
      SITE_URL: https://partsbazar360.com/buyer
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    restart: unless-stopped
    networks:
      - app-network

  seller-portal:
    build:
      context: .
      dockerfile: apps/next.Dockerfile
      args:
        APP_NAME: seller-portal
    restart: unless-stopped
    networks:
      - app-network

  operations-portal:
    build:
      context: .
      dockerfile: apps/next.Dockerfile
      args:
        APP_NAME: operations-portal
    restart: unless-stopped
    networks:
      - app-network

  workshop-portal:
    build:
      context: .
      dockerfile: apps/next.Dockerfile
      args:
        APP_NAME: workshop-portal
    restart: unless-stopped
    networks:
      - app-network

  # ── Reverse Proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - admin-portal
      - buyer-marketplace
      - seller-portal
      - operations-portal
      - workshop-portal
    restart: unless-stopped
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  enrichment_media:

networks:
  app-network:
    driver: bridge
